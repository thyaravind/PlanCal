<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      :root {
        color-scheme: light;
        --editor-text: rgba(20, 24, 31, 0.96);
        --editor-secondary: rgba(60, 60, 67, 0.66);
        --editor-tertiary: rgba(60, 60, 67, 0.12);
        --editor-code: rgba(88, 86, 214, 0.075);
        --editor-quote: rgba(10, 132, 255, 0.1);
        --editor-selection: rgba(10, 132, 255, 0.2);
        --editor-accent: rgb(0, 122, 255);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --editor-text: rgba(245, 245, 247, 0.94);
        --editor-secondary: rgba(235, 235, 245, 0.6);
        --editor-tertiary: rgba(235, 235, 245, 0.11);
        --editor-code: rgba(191, 90, 242, 0.11);
        --editor-quote: rgba(10, 132, 255, 0.14);
        --editor-selection: rgba(10, 132, 255, 0.28);
        --editor-accent: rgb(105, 190, 255);
      }

      * { box-sizing: border-box; }

      html, body, #editor {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
      }

      body {
        color: var(--editor-text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .cm-editor {
        height: 100%;
        color: var(--editor-text);
        background: transparent;
        font-size: 16px;
      }

      .cm-editor.cm-focused { outline: none; }
      .cm-editor .cm-gutters { display: none !important; }

      .cm-scroller {
        overflow: auto;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif !important;
        -webkit-overflow-scrolling: touch;
      }

      .cm-content {
        min-height: 100%;
        padding: 7px 4px 28px;
        caret-color: var(--editor-accent) !important;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif !important;
      }

      .cm-line {
        min-height: 1.55em;
        padding: 3px 5px;
        line-height: 1.55;
      }

      .cm-selectionBackground,
      .cm-content ::selection {
        background: var(--editor-selection) !important;
      }

      .cm-cursor,
      .cm-dropCursor {
        border-left: 2px solid var(--editor-accent) !important;
      }
      .cm-editor .cm-activeLine { background: transparent !important; }
      .cm-placeholder { color: var(--editor-secondary); font-style: normal; }

      .cm-md-heading-1,
      .cm-md-heading-2,
      .cm-md-heading-3,
      .cm-md-heading-4,
      .cm-md-heading-5,
      .cm-md-heading-6 {
        letter-spacing: -0.015em;
        line-height: 1.24;
        font-weight: 720;
        text-decoration: none !important;
      }

      .cm-md-heading-1 *,
      .cm-md-heading-2 *,
      .cm-md-heading-3 *,
      .cm-md-heading-4 *,
      .cm-md-heading-5 *,
      .cm-md-heading-6 * { text-decoration: none !important; }

      .cm-md-heading-1 { padding-top: 13px; padding-bottom: 7px; font-size: 1.72em; }
      .cm-md-heading-2 { padding-top: 11px; padding-bottom: 6px; font-size: 1.43em; }
      .cm-md-heading-3 { padding-top: 9px; padding-bottom: 5px; font-size: 1.22em; }
      .cm-md-heading-4 { padding-top: 7px; font-size: 1.08em; }
      .cm-md-heading-5, .cm-md-heading-6 { padding-top: 6px; font-size: 1em; }

      .cm-md-strong { font-weight: 700; }
      .cm-md-emphasis { font-style: italic; }
      .cm-md-strike { text-decoration: line-through; color: var(--editor-secondary); }

      .cm-md-inline-code {
        padding: 0.08em 0.28em;
        border-radius: 5px;
        background: var(--editor-code);
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace !important;
        font-size: 0.9em;
      }

      .cm-md-quote-line {
        margin-left: 2px;
        padding-left: 12px;
        border-left: 3px solid var(--editor-accent);
        color: var(--editor-secondary);
        background: linear-gradient(90deg, var(--editor-quote), transparent 58%);
      }

      .cm-md-code-line {
        padding-left: 11px;
        padding-right: 11px;
        background: var(--editor-code);
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace !important;
        font-size: 0.88em;
      }

      .cm-md-link { color: var(--editor-accent); text-decoration: underline; text-underline-offset: 2px; }

      .plancal-task-widget {
        display: inline-flex;
        width: 1.65em;
        height: 1.3em;
        align-items: center;
        justify-content: flex-start;
        vertical-align: -0.16em;
      }

      .plancal-task-widget input {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: var(--editor-accent);
        cursor: pointer;
      }

      .cm-tooltip {
        overflow: hidden;
        border: 1px solid var(--editor-tertiary) !important;
        border-radius: 10px;
        color: var(--editor-text);
        background: Canvas !important;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      }
    </style>
    <title>Plancal Markdown Editor</title>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
